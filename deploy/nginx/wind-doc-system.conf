server {
    listen 80;
    server_name documents.example.com;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name documents.example.com;

    ssl_certificate /etc/letsencrypt/live/documents.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/documents.example.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;

    client_max_body_size 200m;

    location ^~ /data/ { return 404; }
    location ^~ /media/ { return 404; }

    # Django only returns this URI after authorization. Direct requests are rejected by internal.
    location ^~ /protected-files/ {
        internal;
        alias /data/documents/;
        default_type application/octet-stream;
        add_header X-Content-Type-Options nosniff always;
        access_log off;
    }

    location = /api/v1/temporary-access/download/ {
        access_log off;
        proxy_pass http://unix:/run/wind-doc-system/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    location /api/ {
        proxy_pass http://unix:/run/wind-doc-system/gunicorn.sock;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }

    location /static/ {
        alias /opt/wind-doc-system/backend/staticfiles/;
        access_log off;
        expires 7d;
    }

    location / {
        root /opt/wind-doc-system/fronted/dist;
        try_files $uri $uri/ /index.html;
    }
}
