paths:
  /api/v1/audit-logs/:
    get:
      operationId: v1_audit_logs_list
      parameters:
      - in: query
        name: action
        schema:
          type: string
      - name: ordering
        required: false
        in: query
        description: 用于排序结果的字段。
        schema:
          type: string
      - name: page
        required: false
        in: query
        description: 分页结果集中的页码。
        schema:
          type: integer
      - in: query
        name: resource_id
        schema:
          type: string
      - in: query
        name: resource_type
        schema:
          type: string
      - in: query
        name: result
        schema:
          type: string
          title: 结果
          enum:
          - denied
          - failure
          - success
        description: |-
          * `success` - 成功
          * `failure` - 失败
          * `denied` - 拒绝
      - name: search
        required: false
        in: query
        description: 搜索关键词。
        schema:
          type: string
      - in: query
        name: user
        schema:
          type: integer
      tags:
      - v1
      security:
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedAuditLogList'
          description: ''
